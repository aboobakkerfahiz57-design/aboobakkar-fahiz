<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

name="description"
content="Aboobakkar Fahiz — Founder, Entrepreneur, Business Builder and Digital Innovator."
>

>

<title>ABOOBAKKAR FAHIZ — Founder • Entrepreneur • Digital Innovator</title>

<!-- Premium Typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link

rel="stylesheet"
>

<style>
/* =========================================================
ROOT
========================================================= */

:root {
--bg: #070707;
--bg-soft: #0d0d0d;
--bg-card: #111111;
--bg-card-2: #151515;

--white: #f5f2ec;
--muted: #9a978f;
--muted-2: #6e6b65;

--gold: #c7a66a;
--gold-light: #e1c58d;
--gold-dark: #80683f;

--line: rgba(255,255,255,0.12);
--line-gold: rgba(199,166,106,0.28);

--max: 1380px;

--ease: cubic-bezier(.22, .61, .36, 1);
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

html {
scroll-behavior: smooth;
background: var(--bg);
}

body {
font-family: "Manrope", sans-serif;
background: var(--bg);
color: var(--white);
overflow-x: hidden;
line-height: 1.6;
}

body.menu-open {
overflow: hidden;
}

::selection {
background: var(--gold);
color: #050505;
}

img {
display: block;
max-width: 100%;
}

a {
color: inherit;
text-decoration: none;
}

button {
font: inherit;
}

/* =========================================================
LOADER
========================================================= */

.loader {
position: fixed;
inset: 0;
z-index: 99999;
background: #050505;
display: flex;
align-items: center;
justify-content: center;
transition:
opacity 1s var(--ease),
visibility 1s var(--ease);
}

.loader.hidden {
opacity: 0;
visibility: hidden;
pointer-events: none;
}

.loader-inner {
text-align: center;
width: min(520px, 80%);
}

.loader-name {
font-family: "DM Mono", monospace;
font-size: 11px;
letter-spacing: .28em;
color: var(--muted);
margin-bottom: 20px;
text-transform: uppercase;
}

.loader-line {
height: 1px;
width: 100%;
background: rgba(255,255,255,.1);
overflow: hidden;
position: relative;
}

.loader-progress {
position: absolute;
left: 0;
top: 0;
height: 100%;
width: 0;
background: var(--gold);
animation: loading 1.6s var(--ease) forwards;
}

@keyframes loading {
to {
width: 100%;
}
}

/* =========================================================
GLOBAL EFFECTS
========================================================= */

.noise {
position: fixed;
inset: 0;
z-index: 9990;
pointer-events: none;
opacity: .035;
background-image:
url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
}

.cursor-glow {
position: fixed;
width: 420px;
height: 420px;
border-radius: 50%;
pointer-events: none;
z-index: 0;
background: radial-gradient(
circle,
rgba(199,166,106,.07),
rgba(199,166,106,0) 68%
);
transform: translate(-50%, -50%);
opacity: .7;
}

.gold-orb {
position: absolute;
width: 400px;
height: 400px;
border-radius: 50%;
background: radial-gradient(
circle at 35% 30%,
rgba(225,197,141,.22),
rgba(199,166,106,.08) 35%,
rgba(0,0,0,0) 70%
);
filter: blur(30px);
pointer-events: none;
}

/* =========================================================
NAVIGATION
========================================================= */

.nav {
position: fixed;
top: 0;
left: 0;
width: 100%;
z-index: 5000;
padding: 22px 30px;
transition:
background .5s ease,
border-color .5s ease,
padding .5s ease;
border-bottom: 1px solid transparent;
}

.nav.scrolled {
background: rgba(7,7,7,.82);
backdrop-filter: blur(22px);
-webkit-backdrop-filter: blur(22px);
border-color: var(--line);
padding-top: 15px;
padding-bottom: 15px;
}

.nav-inner {
width: min(100%, var(--max));
margin: auto;
display: flex;
align-items: center;
justify-content: space-between;
gap: 30px;
}

.brand {
display: inline-flex;
align-items: center;
gap: 12px;
font-family: "DM Mono", monospace;
font-size: 12px;
letter-spacing: .14em;
text-transform: uppercase;
white-space: nowrap;
}

.brand-mark {
width: 34px;
height: 34px;
border: 1px solid var(--gold);
display: grid;
place-items: center;
color: var(--gold);
font-size: 11px;
transform: rotate(45deg);
}

.brand-mark span {
transform: rotate(-45deg);
}

.nav-links {
display: flex;
align-items: center;
gap: 27px;
}

.nav-links a {
font-family: "DM Mono", monospace;
font-size: 10px;
color: rgba(245,242,236,.68);
letter-spacing: .12em;
text-transform: uppercase;
position: relative;
transition: color .3s ease;
}

.nav-links a::after {
content: "";
position: absolute;
left: 0;
bottom: -7px;
width: 0;
height: 1px;
background: var(--gold);
transition: width .35s var(--ease);
}

.nav-links a:hover,
.nav-links a.active {
color: var(--white);
}

.nav-links a:hover::after,
.nav-links a.active::after {
width: 100%;
}

.nav-contact {
display: inline-flex;
align-items: center;
gap: 9px;
border: 1px solid var(--line-gold);
padding: 11px 16px;
font-family: "DM Mono", monospace;
font-size: 9px;
letter-spacing: .12em;
text-transform: uppercase;
transition:
background .3s ease,
color .3s ease,
border-color .3s ease;
}

.nav-contact:hover {
background: var(--gold);
color: #080808;
border-color: var(--gold);
}

.menu-toggle {
width: 44px;
height: 44px;
display: none;
border: 1px solid var(--line);
background: transparent;
color: var(--white);
cursor: pointer;
position: relative;
}

.menu-toggle span {
position: absolute;
width: 19px;
height: 1px;
background: currentColor;
left: 12px;
transition: transform .35s ease, top .35s ease;
}

.menu-toggle span:first-child {
top: 17px;
}

.menu-toggle span:last-child {
top: 25px;
}

.menu-toggle.open span:first-child {
top: 21px;
transform: rotate(45deg);
}

.menu-toggle.open span:last-child {
top: 21px;
transform: rotate(-45deg);
}

/* =========================================================
MOBILE MENU
========================================================= */

.mobile-menu {
position: fixed;
inset: 0;
z-index: 4500;
background: rgba(7,7,7,.98);
display: flex;
align-items: center;
justify-content: center;
opacity: 0;
visibility: hidden;
pointer-events: none;
transition: opacity .45s ease, visibility .45s ease;
}

.mobile-menu.open {
opacity: 1;
visibility: visible;
pointer-events: auto;
}

.mobile-menu-links {
display: flex;
flex-direction: column;
text-align: center;
gap: 25px;
}

.mobile-menu-links a {
font-family: "DM Mono", monospace;
font-size: 14px;
letter-spacing: .18em;
text-transform: uppercase;
color: var(--white);
}

.mobile-menu-links a:hover {
color: var(--gold);
}

/* =========================================================
HERO
========================================================= */

.hero {
min-height: 100svh;
position: relative;
overflow: hidden;
display: flex;
align-items: center;
background:
linear-gradient(
90deg,
rgba(0,0,0,.88) 0%,
rgba(0,0,0,.57) 43%,
rgba(0,0,0,.38) 100%
),
linear-gradient(
180deg,
rgba(0,0,0,.2),
rgba(0,0,0,.85)
),
url("homepage-background.jpg") center center / cover no-repeat;
}

.hero::before {
content: "";
position: absolute;
inset: 0;
background:
linear-gradient(
90deg,
transparent 0,
rgba(199,166,106,.04) 50%,
transparent 100%
);
animation: heroLight 7s ease-in-out infinite;
}

@keyframes heroLight {
0%,100% {
opacity: .4;
transform: translateX(-5%);
}
50% {
opacity: 1;
transform: translateX(5%);
}
}

.hero-grid {
position: absolute;
inset: 0;
background-image:
linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
background-size: 90px 90px;
mask-image: linear-gradient(to bottom, transparent, black 25%, transparent 100%);
opacity: .25;
}

.hero-inner {
width: min(100%, var(--max));
margin: auto;
padding: 150px 30px 80px;
position: relative;
z-index: 2;
}

.hero-meta {
display: flex;
align-items: center;
gap: 14px;
margin-bottom: 27px;
opacity: 0;
animation: heroReveal 1s .8s var(--ease) forwards;
}

.hero-dot {
width: 7px;
height: 7px;
background: var(--gold);
border-radius: 50%;
box-shadow: 0 0 18px rgba(199,166,106,.7);
}

.eyebrow {
font-family: "DM Mono", monospace;
font-size: 10px;
letter-spacing: .25em;
text-transform: uppercase;
color: var(--gold-light);
}

.hero-title {
max-width: 1050px;
font-size: clamp(56px, 9.8vw, 145px);
line-height: .86;
font-weight: 700;
letter-spacing: -.075em;
text-transform: uppercase;
margin-left: -7px;
opacity: 0;
animation: heroReveal 1.15s .95s var(--ease) forwards;
}

.hero-title .outline {
color: transparent;
-webkit-text-stroke: 1px rgba(245,242,236,.8);
}

.hero-title .gold {
color: var(--gold-light);
}

.hero-sub {
max-width: 630px;
margin-top: 34px;
color: rgba(245,242,236,.67);
font-size: clamp(14px, 1.3vw, 18px);
font-weight: 300;
line-height: 1.8;
opacity: 0;
animation: heroReveal 1s 1.25s var(--ease) forwards;
}

.hero-buttons {
display: flex;
flex-wrap: wrap;
gap: 12px;
margin-top: 35px;
opacity: 0;
animation: heroReveal 1s 1.4s var(--ease) forwards;
}

@keyframes heroReveal {
from {
opacity: 0;
transform: translateY(30px);
}
to {
opacity: 1;
transform: translateY(0);
}
}

.btn {
display: inline-flex;
align-items: center;
justify-content: center;
gap: 12px;
min-height: 49px;
padding: 0 20px;
border: 1px solid var(--line);
background: rgba(255,255,255,.025);
color: var(--white);
font-family: "DM Mono", monospace;
font-size: 9px;
letter-spacing: .15em;
text-transform: uppercase;
cursor: pointer;
transition:
transform .35s var(--ease),
background .35s ease,
color .35s ease,
border-color .35s ease;
}

.btn:hover {
transform: translateY(-3px);
border-color: var(--gold);
background: var(--gold);
color: #070707;
}

.btn-primary {
background: var(--gold);
color: #080808;
border-color: var(--gold);
}

.btn-primary:hover {
background: var(--gold-light);
border-color: var(--gold-light);
}

.btn-arrow {
font-size: 15px;
line-height: 1;
}

.hero-bottom {
position: absolute;
left: 30px;
right: 30px;
bottom: 29px;
z-index: 2;
display: flex;
justify-content: space-between;
align-items: end;
width: min(calc(100% - 60px), var(--max));
margin: auto;
}

.scroll-indicator {
display: flex;
align-items: center;
gap: 13px;
color: rgba(245,242,236,.45);
font-family: "DM Mono", monospace;
font-size: 9px;
letter-spacing: .18em;
text-transform: uppercase;
}

.scroll-line {
width: 70px;
height: 1px;
background: rgba(255,255,255,.22);
position: relative;
overflow: hidden;
}

.scroll-line::after {
content: "";
position: absolute;
left: -100%;
width: 100%;
height: 100%;
background: var(--gold);
animation: scrollLine 2.3s infinite;
}

@keyframes scrollLine {
0% {
left: -100%;
}
45%,100% {
left: 100%;
}
}

.hero-location {
text-align: right;
color: rgba(245,242,236,.42);
font-family: "DM Mono", monospace;
font-size: 9px;
letter-spacing: .15em;
text-transform: uppercase;
}

/* =========================================================
SECTION SYSTEM
========================================================= */

section {
position: relative;
scroll-margin-top: 80px;
}

.section {
padding: 140px 30px;
}

.section-inner {
width: min(100%, var(--max));
margin: auto;
}

.section-head {
display: grid;
grid-template-columns: 180px 1fr;
gap: 50px;
align-items: start;
margin-bottom: 75px;
}

.section-number {
font-family: "DM Mono", monospace;
font-size: 10px;
color: var(--gold);
letter-spacing: .18em;
text-transform: uppercase;
padding-top: 10px;
}

.section-title {
font-size: clamp(42px, 6vw, 88px);
line-height: .95;
letter-spacing: -.055em;
text-transform: uppercase;
font-weight: 700;
}

.section-title em {
font-family: "Playfair Display", serif;
text-transform: none;
font-weight: 500;
letter-spacing: -.025em;
}

.section-description {
max-width: 700px;
margin-left: auto;
margin-top: -35px;
color: var(--muted);
font-size: 16px;
font-weight: 300;
line-height: 1.9;
}

.gold-line {
width: 55px;
height: 1px;
background: var(--gold);
margin-bottom: 23px;
}

/* =========================================================
REVEALS
========================================================= */

.reveal {
opacity: 0;
transform: translateY(35px);
transition:
opacity 1s var(--ease),
transform 1s var(--ease);
}

.reveal.visible {
opacity: 1;
transform: translateY(0);
}

.reveal-left {
opacity: 0;
transform: translateX(-45px);
transition:
opacity 1s var(--ease),
transform 1s var(--ease);
}

.reveal-left.visible {
opacity: 1;
transform: translateX(0);
}

.reveal-right {
opacity: 0;
transform: translateX(45px);
transition:
opacity 1s var(--ease),
transform 1s var(--ease);
}

.reveal-right.visible {
opacity: 1;
transform: translateX(0);
}

/* =========================================================
WHO I AM
========================================================= */

.about {
background:
radial-gradient(circle at 75% 30%, rgba(199,166,106,.07), transparent 30%),
var(--bg);
}

.about-layout {
display: grid;
grid-template-columns: .9fr 1.1fr;
gap: 100px;
align-items: center;
}

.about-visual {
min-height: 620px;
position: relative;
overflow: hidden;
border: 1px solid var(--line);
background:
linear-gradient(135deg, rgba(199,166,106,.12), transparent 45%),
#0b0b0b;
}

.about-visual::before {
content: "AF";
position: absolute;
left: 30px;
bottom: 5px;
font-size: clamp(130px, 20vw, 270px);
line-height: 1;
font-weight: 800;
letter-spacing: -.12em;
color: rgba(255,255,255,.025);
z-index: 0;
}

.about-frame {
position: absolute;
inset: 28px;
border: 1px solid var(--line-gold);
}

.about-orbit {
position: absolute;
width: 330px;
height: 330px;
border: 1px solid rgba(199,166,106,.3);
border-radius: 50%;
left: 50%;
top: 50%;
transform: translate(-50%,-50%) rotate(18deg);
}

.about-orbit::before,
.about-orbit::after {
content: "";
position: absolute;
inset: 35px;
border: 1px solid rgba(255,255,255,.08);
border-radius: 50%;
}

.about-orbit::after {
inset: 85px;
border-color: rgba(199,166,106,.18);
}

.about-monogram {
position: absolute;
left: 50%;
top: 50%;
transform: translate(-50%,-50%);
width: 120px;
height: 120px;
border: 1px solid var(--gold);
display: grid;
place-items: center;
font-size: 45px;
font-weight: 700;
letter-spacing: -.1em;
color: var(--gold-light);
background: rgba(7,7,7,.72);
box-shadow: 0 0 70px rgba(199,166,106,.09);
}

.about-corner {
position: absolute;
font-family: "DM Mono", monospace;
font-size: 8px;
letter-spacing: .15em;
color: var(--muted-2);
text-transform: uppercase;
}

.about-corner.top {
top: 45px;
left: 45px;
}

.about-corner.bottom {
bottom: 45px;
right: 45px;
}

.about-copy h3 {
font-size: clamp(30px, 4vw, 54px);
line-height: 1.05;
letter-spacing: -.045em;
margin-bottom: 28px;
}

.about-copy h3 span {
color: var(--gold-light);
}

.about-copy p {
color: var(--muted);
font-size: 16px;
font-weight: 300;
line-height: 2;
margin-bottom: 22px;
}

.identity-list {
margin-top: 40px;
border-top: 1px solid var(--line);
}

.identity-item {
display: flex;
justify-content: space-between;
gap: 30px;
padding: 17px 0;
border-bottom: 1px solid var(--line);
font-family: "DM Mono", monospace;
font-size: 10px;
letter-spacing: .1em;
text-transform: uppercase;
}

.identity-item span:first-child {
color: var(--muted-2);
}

.identity-item span:last-child {
color: var(--white);
text-align: right;
}

/* =========================================================
ROLES
========================================================= */

.roles {
background: #090909;
border-top: 1px solid var(--line);
border-bottom: 1px solid var(--line);
}

.roles-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
border-top: 1px solid var(--line);
border-left: 1px solid var(--line);
}

.role-card {
min-height: 440px;
padding: 35px;
border-right: 1px solid var(--line);
border-bottom: 1px solid var(--line);
position: relative;
overflow: hidden;
transition:
background .5s ease,
transform .5s var(--ease);
}

.role-card:hover {
background: #101010;
}

.role-number {
font-family: "DM Mono", monospace;
color: var(--gold);
font-size: 10px;
letter-spacing: .15em;
}

.role-icon {
width: 58px;
height: 58px;
border: 1px solid var(--line-gold);
display: grid;
place-items: center;
margin: 70px 0 35px;
color: var(--gold-light);
font-size: 21px;
transition: transform .6s var(--ease);
}

.role-card:hover .role-icon {
transform: rotate(45deg);
}

.role-card h3 {
font-size: 25px;
line-height: 1.15;
letter-spacing: -.035em;
margin-bottom: 12px;
}

.role-card p {
color: var(--muted);
font-size: 13px;
line-height: 1.8;
max-width: 340px;
}

.role-tag {
position: absolute;
bottom: 30px;
left: 35px;
color: var(--gold);
font-family: "DM Mono", monospace;
font-size: 8px;
letter-spacing: .18em;
text-transform: uppercase;
}

/* =========================================================
JOURNEY
========================================================= */

.journey {
background:
linear-gradient(180deg, #090909, #070707);
}

.timeline {
position: relative;
margin-top: 50px;
}

.timeline::before {
content: "";
position: absolute;
left: 50%;
top: 0;
bottom: 0;
width: 1px;
background: linear-gradient(
to bottom,
transparent,
var(--line-gold) 10%,
var(--line-gold) 90%,
transparent
);
}

.timeline-item {
width: 50%;
padding: 0 70px 75px;
position: relative;
}

.timeline-item:nth-child(even) {
margin-left: 50%;
}

.timeline-dot {
position: absolute;
top: 5px;
width: 9px;
height: 9px;
border: 1px solid var(--gold);
background: var(--bg);
border-radius: 50%;
box-shadow: 0 0 0 6px rgba(199,166,106,.05);
}

.timeline-item:nth-child(odd) .timeline-dot {
right: -5px;
}

.timeline-item:nth-child(even) .timeline-dot {
left: -5px;
}

.timeline-date {
font-family: "DM Mono", monospace;
color: var(--gold);
font-size: 10px;
letter-spacing: .18em;
margin-bottom: 17px;
}

.timeline-item h3 {
font-size: clamp(24px, 3vw, 38px);
letter-spacing: -.04em;
line-height: 1.05;
margin-bottom: 13px;
}

.timeline-item p {
color: var(--muted);
font-size: 13px;
line-height: 1.9;
}

/* =========================================================
COMPANY SECTIONS
========================================================= */

.company {
padding: 0 30px 140px;
background: #070707;
}

.company-shell {
width: min(100%, var(--max));
margin: auto;
border: 1px solid var(--line);
overflow: hidden;
position: relative;
}

.company-layout {
display: grid;
grid-template-columns: 1fr 1fr;
min-height: 700px;
}

.company-image {
min-height: 700px;
position: relative;
overflow: hidden;
background: #101010;
}

.company-image img {
width: 100%;
height: 100%;
object-fit: cover;
transition: transform 1.2s var(--ease);
}

.company-shell:hover .company-image img {
transform: scale(1.035);
}

.company-image::after {
content: "";
position: absolute;
inset: 0;
background:
linear-gradient(
90deg,
transparent 45%,
rgba(0,0,0,.48)
),
linear-gradient(
180deg,
rgba(0,0,0,.08),
rgba(0,0,0,.45)
);
pointer-events: none;
}

.company-badge {
position: absolute;
left: 28px;
top: 28px;
z-index: 2;
padding: 11px 14px;
border: 1px solid rgba(255,255,255,.2);
background: rgba(0,0,0,.48);
backdrop-filter: blur(12px);
font-family: "DM Mono", monospace;
font-size: 8px;
letter-spacing: .16em;
text-transform: uppercase;
}

.company-content {
padding: 65px;
display: flex;
flex-direction: column;
justify-content: center;
background:
radial-gradient(circle at 100% 0%, rgba(199,166,106,.08), transparent 40%),
#0c0c0c;
}

.company-label {
color: var(--gold);
font-family: "DM Mono", monospace;
font-size: 9px;
letter-spacing: .22em;
text-transform: uppercase;
margin-bottom: 16px;
}

.company-title {
font-size: clamp(42px, 5vw, 72px);
line-height: .95;
letter-spacing: -.06em;
text-transform: uppercase;
margin-bottom: 17px;
}

.company-title span {
display: block;
color: var(--gold-light);
font-family: "Playfair Display", serif;
font-style: italic;
text-transform: none;
letter-spacing: -.03em;
}

.company-role {
color: var(--muted);
font-family: "DM Mono", monospace;
font-size: 9px;
letter-spacing: .15em;
text-transform: uppercase;
margin-bottom: 28px;
}

.company-description {
color: var(--muted);
font-size: 14px;
line-height: 1.95;
max-width: 570px;
margin-bottom: 30px;
}

.company-facts {
border-top: 1px solid var(--line);
margin-bottom: 30px;
}

.fact {
display: flex;
justify-content: space-between;
gap: 25px;
padding: 13px 0;
border-bottom: 1px solid var(--line);
font-family: "DM Mono", monospace;
font-size: 9px;
letter-spacing: .08em;
text-transform: uppercase;
}

.fact span:first-child {
color: var(--muted-2);
}

.fact span:last-child {
color: var(--white);
text-align: right;
}

.company-buttons {
display: flex;
flex-wrap: wrap;
gap: 10px;
}

/* =========================================================
BUSINESS UNITS
========================================================= */

.business-units {
margin-top: 55px;
display: grid;
grid-template-columns: repeat(3, 1fr);
border-top: 1px solid var(--line);
border-left: 1px solid var(--line);
}

.business-unit {
padding: 32px;
min-height: 285px;
border-right: 1px solid var(--line);
border-bottom: 1px solid var(--line);
transition: background .4s ease;
}

.business-unit:hover {
background: #121212;
}

.business-unit-number {
font-family: "DM Mono", monospace;
font-size: 9px;
color: var(--gold);
letter-spacing: .15em;
}

.business-unit h3 {
margin-top: 65px;
font-size: 23px;
line-height: 1.1;
letter-spacing: -.035em;
text-transform: uppercase;
}

.business-unit p {
margin-top: 12px;
color: var(--muted);
font-size: 12px;
line-height: 1.75;
}

.business-unit small {
display: block;
margin-top: 22px;
color: var(--gold);
font-family: "DM Mono", monospace;
font-size: 8px;
letter-spacing: .13em;
text-transform: uppercase;
}

/* =========================================================
VELORA SERVICES
========================================================= */

.velora-services {
margin-top: 55px;
border-top: 1px solid var(--line);
}

.service-row {
display: grid;
grid-template-columns: 70px 1fr 1.2fr;
gap: 25px;
align-items: center;
padding: 23px 0;
border-bottom: 1px solid var(--line);
}

.service-number {
font-family: "DM Mono", monospace;
color: var(--gold);
font-size: 9px;
}

.service-row h4 {
font-size: 17px;
letter-spacing: -.025em;
}

.service-row p {
color: var(--muted);
font-size: 12px;
}

/* =========================================================
DIGITAL WORK
========================================================= */

.work {
background: #0a0a0a;
border-top: 1px solid var(--line);
}

.work-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
border-top: 1px solid var(--line);
border-left: 1px solid var(--line);
}

.work-card {
min-height: 320px;
padding: 30px;
border-right: 1px solid var(--line);
border-bottom: 1px solid var(--line);
position: relative;
display: flex;
flex-direction: column;
justify-content: space-between;
overflow: hidden;
background:
linear-gradient(
135deg,
rgba(255,255,255,.025),
transparent 45%
);
transition:
background .45s ease,
transform .45s var(--ease);
}

.work-card::before {
content: "";
position: absolute;
width: 180px;
height: 180px;
right: -70px;
bottom: -70px;
border: 1px solid rgba(199,166,106,.1);
transform: rotate(45deg);
transition: transform .6s var(--ease);
}

.work-card:hover {
background: #111111;
}

.work-card:hover::before {
transform: rotate(65deg) scale(1.2);
}

.work-top {
display: flex;
justify-content: space-between;
gap: 20px;
}

.work-index {
color: var(--gold);
font-family: "DM Mono", monospace;
font-size: 9px;
letter-spacing: .15em;
}

.work-type {
color: var(--muted-2);
font-family: "DM Mono", monospace;
font-size: 8px;
letter-spacing: .12em;
text-transform: uppercase;
text-align: right;
}

.work-card h3 {
font-size: 25px;
line-height: 1.05;
letter-spacing: -.04em;
margin-top: 45px;
max-width: 330px;
}

.work-card p {
color: var(--muted);
font-size: 11px;
line-height: 1.7;
margin-top: 12px;
max-width: 330px;
}

.work-link {
margin-top: 25px;
display: inline-flex;
align-items: center;
gap: 9px;
color: var(--gold-light);
font-family: "DM Mono", monospace;
font-size: 8px;
letter-spacing: .15em;
text-transform: uppercase;
}

.work-link span {
transition: transform .3s ease;
}

.work-card:hover .work-link span {
transform: translateX(5px);
}

/* =========================================================
GALLERY
========================================================= */

.gallery {
background:
radial-gradient(circle at 10% 20%, rgba(199,166,106,.055), transparent 25%),
#070707;
}

.gallery-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 7px;
}

.gallery-item {
aspect-ratio: 1 / 1;
overflow: hidden;
position: relative;
cursor: pointer;
background: #111;
}

.gallery-item:nth-child(3n+1) {
aspect-ratio: .9 / 1;
}

.gallery-item img {
width: 100%;
height: 100%;
object-fit: cover;
filter: grayscale(.1);
transition:
transform .8s var(--ease),
filter .6s ease;
}

.gallery-overlay {
position: absolute;
inset: 0;
display: flex;
align-items: end;
padding: 17px;
background:
linear-gradient(
to top,
rgba(0,0,0,.72),
transparent 55%
);
opacity: 0;
transition: opacity .4s ease;
}

.gallery-overlay span {
font-family: "DM Mono", monospace;
font-size: 8px;
letter-spacing: .15em;
color: var(--white);
}

.gallery-item:hover img {
transform: scale(1.06);
filter: grayscale(0);
}

.gallery-item:hover .gallery-overlay {
opacity: 1;
}

/* =========================================================
LIGHTBOX
========================================================= */

.lightbox {
position: fixed;
inset: 0;
z-index: 10000;
background: rgba(0,0,0,.96);
display: flex;
align-items: center;
justify-content: center;
opacity: 0;
visibility: hidden;
pointer-events: none;
transition: opacity .4s ease, visibility .4s ease;
padding: 30px;
}

.lightbox.open {
opacity: 1;
visibility: visible;
pointer-events: auto;
}

.lightbox-image-wrap {
max-width: min(1100px, 90vw);
max-height: 84vh;
position: relative;
}

.lightbox img {
max-width: 100%;
max-height: 84vh;
width: auto;
height: auto;
object-fit: contain;
border: 1px solid rgba(255,255,255,.12);
box-shadow: 0 30px 100px rgba(0,0,0,.7);
}

.lightbox-close,
.lightbox-prev,
.lightbox-next {
position: fixed;
width: 48px;
height: 48px;
border: 1px solid rgba(255,255,255,.18);
background: rgba(10,10,10,.75);
color: var(--white);
display: grid;
place-items: center;
cursor: pointer;
transition:
background .3s ease,
color .3s ease,
border-color .3s ease;
z-index: 2;
}

.lightbox-close:hover,
.lightbox-prev:hover,
.lightbox-next:hover {
background: var(--gold);
color: #050505;
border-color: var(--gold);
}

.lightbox-close {
top: 25px;
right: 25px;
font-size: 20px;
}

.lightbox-prev {
left: 25px;
top: 50%;
transform: translateY(-50%);
font-size: 20px;
}

.lightbox-next {
right: 25px;
top: 50%;
transform: translateY(-50%);
font-size: 20px;
}

.lightbox-counter {
position: fixed;
bottom: 27px;
left: 50%;
transform: translateX(-50%);
font-family: "DM Mono", monospace;
color: var(--muted);
font-size: 9px;
letter-spacing: .17em;
}

/* =========================================================
VISION
========================================================= */

.vision {
min-height: 760px;
display: flex;
align-items: center;
overflow: hidden;
background:
linear-gradient(
135deg,
rgba(0,0,0,.96),
rgba(8,8,8,.82)
),
url("homepage-background.jpg") center / cover no-repeat;
border-top: 1px solid var(--line);
border-bottom: 1px solid var(--line);
}

.vision::before {
content: "";
position: absolute;
width: 800px;
height: 800px;
right: -250px;
top: 50%;
transform: translateY(-50%);
border: 1px solid rgba(199,166,106,.12);
border-radius: 50%;
box-shadow:
0 0 0 80px rgba(199,166,106,.025),
0 0 0 160px rgba(199,166,106,.015);
}

.vision-inner {
width: min(100%, var(--max));
margin: auto;
padding: 140px 30px;
position: relative;
z-index: 2;
}

.vision-label {
color: var(--gold);
font-family: "DM Mono", monospace;
font-size: 9px;
letter-spacing: .25em;
text-transform: uppercase;
margin-bottom: 35px;
}

.vision-title {
max-width: 1000px;
font-size: clamp(48px, 8vw, 120px);
line-height: .9;
letter-spacing: -.075em;
text-transform: uppercase;
}

.vision-title span {
color: var(--gold-light);
font-family: "Playfair Display", serif;
font-style: italic;
text-transform: none;
letter-spacing: -.04em;
}

.vision-copy {
max-width: 650px;
color: var(--muted);
font-size: 15px;
line-height: 2;
margin-top: 38px;
}

/* =========================================================
NEXT CHAPTER
========================================================= */

.next {
padding: 150px 30px;
background: #070707;
text-align: center;
}

.next-inner {
width: min(100%, 1000px);
margin: auto;
}

.next-small {
font-family: "DM Mono", monospace;
color: var(--gold);
font-size: 9px;
letter-spacing: .25em;
text-transform: uppercase;
margin-bottom: 30px;
}

.next-title {
font-size: clamp(52px, 9vw, 130px);
line-height: .85;
letter-spacing: -.075em;
text-transform: uppercase;
}

.next-title span {
display: block;
font-family: "Playfair Display", serif;
font-style: italic;
color: var(--gold-light);
text-transform: none;
letter-spacing: -.04em;
}

.next p {
max-width: 590px;
margin: 35px auto 0;
color: var(--muted);
font-size: 14px;
line-height: 1.9;
}

/* =========================================================
CONTACT
========================================================= */

.contact {
background:
radial-gradient(circle at 50% 0%, rgba(199,166,106,.08), transparent 35%),
#0a0a0a;
border-top: 1px solid var(--line);
}

.contact-layout {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 100px;
align-items: start;
}

.contact-title {
font-size: clamp(48px, 7vw, 100px);
line-height: .88;
letter-spacing: -.07em;
text-transform: uppercase;
}

.contact-title span {
color: var(--gold-light);
font-family: "Playfair Display", serif;
font-style: italic;
text-transform: none;
letter-spacing: -.04em;
}

.contact-copy {
color: var(--muted);
font-size: 14px;
line-height: 1.9;
margin-top: 30px;
max-width: 500px;
}

.contact-actions {
margin-top: 35px;
display: flex;
flex-wrap: wrap;
gap: 10px;
}

.contact-list {
border-top: 1px solid var(--line);
}

.contact-item {
display: grid;
grid-template-columns: 100px 1fr;
gap: 25px;
padding: 21px 0;
border-bottom: 1px solid var(--line);
}

.contact-item-label {
color: var(--muted-2);
font-family: "DM Mono", monospace;
font-size: 8px;
letter-spacing: .15em;
text-transform: uppercase;
}

.contact-item a,
.contact-item span {
font-size: 14px;
color: var(--white);
word-break: break-word;
}

.contact-item a:hover {
color: var(--gold-light);
}

/* =========================================================
FOOTER
========================================================= */

footer {
border-top: 1px solid var(--line);
padding: 28px 30px;
background: #050505;
}

.footer-inner {
width: min(100%, var(--max));
margin: auto;
display: flex;
justify-content: space-between;
align-items: center;
gap: 20px;
}

.footer-left,
.footer-right {
font-family: "DM Mono", monospace;
font-size: 8px;
letter-spacing: .13em;
color: var(--muted-2);
text-transform: uppercase;
}

.footer-right {
display: flex;
gap: 18px;
}

.footer-right a:hover {
color: var(--gold);
}

/* =========================================================
RESPONSIVE
========================================================= */

@media (max-width: 1100px) {

.nav-links {
gap: 17px;
}

.nav-contact {
display: none;
}

.about-layout {
gap: 60px;
}

.company-layout {
grid-template-columns: 1fr;
}

.company-image {
min-height: 560px;
}

.company-content {
padding: 55px;
}

.work-grid {
grid-template-columns: repeat(2, 1fr);
}

.gallery-grid {
grid-template-columns: repeat(3, 1fr);
}

.contact-layout {
gap: 60px;
}
}

}

.nav-links {
display: none;
}

.menu-toggle {
display: block;
}

.hero {
min-height: 100svh;
background-position: 58% center;
}

.hero-inner {
padding: 145px 20px 110px;
}

.hero-title {
font-size: clamp(54px, 15vw, 90px);
}

.hero-bottom {
left: 20px;
right: 20px;
width: auto;
}

.hero-location {

}

.section {

}

.section-head {

}

.section-number {

}

.section-description {
margin: 25px 0 0;
}

.about-layout {
grid-template-columns: 1fr;
gap: 50px;
}

.about-visual {
min-height: 480px;
}

.roles-grid {
grid-template-columns: 1fr;
}

.role-card {
min-height: 360px;
}

.timeline::before {
left: 8px;
}

.timeline-item,
.timeline-item:nth-child(even) {
width: 100%;
margin-left: 0;

padding-right: 0;
}
